################
### MONITORS ###
################

# See https://wiki.hyprland.org/Configuring/Monitors/
monitor = eDP-1, 1920x1200@60, 0x0, 1
monitor = DP-2, 1920x1080@60, 1920x0, 1

# unscale XWayland
xwayland {
  force_zero_scaling = true
}

###############
### GESTURE ###
###############

gesture = 3, horizontal, workspace
